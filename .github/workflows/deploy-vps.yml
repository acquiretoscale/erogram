# Deploy main to DigitalOcean.
# Repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR (optional, default ~/erogram)
#
# This workflow must NEVER git-reset or npm-build inside the live folder before
# the deploy script runs. The script builds in a sibling directory, then swaps
# .next only after compile succeeds, then restarts `erogram` (port 3941).

name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'middleware.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ecosystem.config.js'
      - 'public/**'
      - 'scripts/vps-deploy-erogram.sh'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'acquiretoscale/erogram'
    timeout-minutes: 45

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="$HOME/erogram"; fi
            cd "$APP_DIR"
            git fetch origin main
            git show origin/main:scripts/vps-deploy-erogram.sh > /tmp/vps-deploy-erogram.sh
            chmod +x /tmp/vps-deploy-erogram.sh
            APP_DIR="$APP_DIR" bash /tmp/vps-deploy-erogram.sh
