# Deploy main to DigitalOcean after CI build passes.
# Repo secrets required: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR (optional, default ~/erogram)

name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'middleware.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'ecosystem.config.js'
      - 'public/**'
      - 'scripts/vps-deploy-erogram.sh'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    if: github.repository == 'acquiretoscale/erogram'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="$HOME/erogram"; fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            bash scripts/vps-deploy-erogram.sh
