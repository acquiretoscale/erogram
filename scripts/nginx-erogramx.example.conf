# Reference nginx site config for erogramx.com on DigitalOcean.
# Install: /etc/nginx/sites-available/erogramx → symlink sites-enabled → nginx -t → reload
#
# Erogram Next.js listens on 127.0.0.1:3941 (PM2). Slutbot uses 3940 — do not swap.

upstream erogram_next {
    server 127.0.0.1:3941;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erogramx.com www.erogramx.com;

    # ssl_certificate ... (certbot)

    location / {
        proxy_pass http://erogram_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# erogram.pro → 308 to erogramx.com (legacy)
server {
    listen 443 ssl http2;
    server_name erogram.pro www.erogram.pro;
    return 308 https://erogramx.com$request_uri;
}
